name: Hotpath monitor relay

on:
  workflow_run:
    workflows: ["Hotpath monitor benchmark"]
    types: [completed]

permissions: {}

jobs:
  relay:
    # only successful pull request runs have a report; the action checks this too
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    concurrency:
      group: hotpath-relay-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: hotpath-rs/hotpath-relay@v1.0.0
        with:
          benchmark: profile_monitor
          artifact_name: hotpath-report
          report_file: report.json
