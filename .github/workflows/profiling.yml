name: Profiling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOTPATH_METRICS_SERVER_OFF: "true"
      HOTPATH_OUTPUT_PATH: hotpath-monitor.json
      HOTPATH_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain master, pinned at setup
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.0"
      - name: Profile monitor workload
        run: >-
          cargo run --locked --profile deploy -p raijin-core
          --example profile_monitor --features hotpath-alloc
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotpath-monitor-${{ matrix.os }}
          path: hotpath-monitor.json
          if-no-files-found: error
