name: Profiling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOTPATH_METRICS_SERVER_OFF: "true"
      HOTPATH_OUTPUT_PATH: hotpath-monitor.json
      HOTPATH_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-25
      - name: Profile monitor workload
        run: >-
          cargo run --locked --profile deploy -p raijin-core
          --example profile_monitor --features hotpath-alloc
      - uses: actions/upload-artifact@v7
        with:
          name: hotpath-monitor-${{ matrix.os }}
          path: hotpath-monitor.json
          if-no-files-found: error
