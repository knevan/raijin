name: Hotpath monitor benchmark

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  upload:
    name: benchmark (push)
    if: github.event_name == 'push'
    concurrency:
      group: hotpath-upload-profile_monitor-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env: &benchmark-env
      HOTPATH_BENCHMARK: profile_monitor
      HOTPATH_USER_METADATA: >-
        runner=Linux-X64,toolchain=1.99.0,profile=deploy,valgrind=3.26.0
      HOTPATH_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain master, pinned at setup
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.0"
      # Swatinem/rust-cache v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
      - name: Build benchmark
        run: |
          cargo build -q --locked --profile deploy -p raijin-core \
            --example profile_monitor \
            --features hotpath-alloc,hotpath-cloud,hotpath-callgrind
      - name: Run benchmark natively
        env:
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: target/deploy/examples/profile_monitor
      - name: Run benchmark under Callgrind and upload the merged report
        env:
          HOTPATH_UPLOAD: fail-on-error
          HOTPATH_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload.json
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_CALLGRIND_OUT_FILE" \
            target/deploy/examples/profile_monitor
          test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"
          jq -e '.meta.run == "merged"
            and (.functions_icount.data | length > 0)
            and (.functions_timing.data | length > 0)' \
            "$HOTPATH_OUTPUT_PATH" > /dev/null

  report:
    name: benchmark (pull request)
    if: github.event_name == 'pull_request'
    concurrency:
      group: hotpath-report-profile_monitor-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env: *benchmark-env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # dtolnay/rust-toolchain master, pinned at setup
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.0"
      # Swatinem/rust-cache v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
      - name: Build benchmark
        run: |
          cargo build -q --locked --profile deploy -p raijin-core \
            --example profile_monitor \
            --features hotpath-alloc,hotpath-cloud,hotpath-callgrind
      - name: Run benchmark natively
        env:
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: target/deploy/examples/profile_monitor
      - name: Run benchmark under Callgrind and write the merged report
        env:
          HOTPATH_OUTPUT_PATH: report.json
          HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_CALLGRIND_OUT_FILE" \
            target/deploy/examples/profile_monitor
          test -s report.json
          jq -e '.meta.run == "merged"
            and (.functions_icount.data | length > 0)
            and (.functions_timing.data | length > 0)' \
            report.json > /dev/null
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotpath-report
          path: report.json
          retention-days: 1
          if-no-files-found: error
