[package]
name = "raijin-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "raijin"
path = "src/main.rs"

[features]
hotpath = ["hotpath/hotpath", "raijin-core/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "raijin-core/hotpath-alloc"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus", "raijin-core/hotpath-prometheus"]

[dependencies]
hotpath = { workspace = true }
gpui-kit = { workspace = true }
gpui-tray = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
raijin-core = { workspace = true }
async-channel = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }