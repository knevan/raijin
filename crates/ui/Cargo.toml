[package]
name = "raijin-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "raijin"
path = "src/main.rs"

[features]
hotpath = ["hotpath/hotpath", "raijin-core/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "raijin-core/hotpath-alloc"]

[dependencies]
hotpath = { workspace = true }
gpui-kit = { workspace = true }
gpui-tray = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
raijin-core = { path = "../core" }
async-channel = "2"
log = "0.4"
thiserror = { workspace = true }

