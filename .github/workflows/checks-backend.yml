name: Checks/Backend

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: checks-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter-changes:
    name: Filter Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
    - uses: actions/checkout@v4

    - name: Detect backend changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          backend:
            - 'crates/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rustfmt.toml'
            - '.github/workflows/checks-backend.yml'

  fmt:
    name: Format
    needs: filter-changes
    if: needs.filter-changes.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check code formatting
      run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: filter-changes
    if: needs.filter-changes.outputs.backend == 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - uses: swatinem/rust-cache@v2

    - name: Lint core
      run: cargo clippy --all-targets -p raijin-core -- -D warnings

    - name: Lint UI
      run: cargo clippy --all-targets -p raijin-ui -- -D warnings

    - name: Check UI compilation
      run: cargo check -p raijin-ui

  test:
    name: Test
    needs: filter-changes
    if: needs.filter-changes.outputs.backend == 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2

    - name: Run Tests raijin-core
      run: cargo test -p raijin-core
