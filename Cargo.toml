[package]
name = "raijin"
version = "0.1.0"
edition = "2024"

[dependencies]
freya = { git = "https://github.com/marc2332/freya.git", optional = true, branch = "main", features = [
    "sdk-tokio",
    "icons-lucide",
    "tray"
] }
rfd = { version = "0.17", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time"
] }
tokio-util = "0.7"
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.23"

[features]
default = []
desktop = ["dep:freya", "dep:rfd"]
dev = [
    "desktop",
    "freya/devtools",
    "freya/hotreload"
]
